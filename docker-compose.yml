# MuseotekBox's own Postgres only. The backend itself always runs directly (IntelliJ /
# ./mvnw spring-boot:run), never in Docker — Postgres is the one dependency actually
# owned by this repo, unlike Keycloak/Catalogue which are separate services.
#
# Prerequisites:
#   cp .env.example .env      # then set DB_USERNAME/DB_PASSWORD
# Then:
#   docker compose up -d
#
# DB_PORT defaults to 5432 to match application.properties' DB_URL default with zero
# extra config. Only change it (and DB_URL to match) if something else on the host is
# already using 5432 — e.g. an existing native Postgres install.
name: museotek-box-backend

services:
  postgres:
    image: postgres:16.6-bookworm
    environment:
      POSTGRES_DB: museotekbox
      POSTGRES_USER: ${DB_USERNAME:?set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - museotekbox-db-data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-museotek} -d museotekbox"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  museotekbox-db-data:
