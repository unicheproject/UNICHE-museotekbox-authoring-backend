# Only used by @ActiveProfiles("test") integration tests. Production always runs
# against PostgreSQL — H2 here is purely to give security/JIT integration tests a real
# (if in-memory) JPA/transaction stack without needing a running Postgres instance.
spring.datasource.url=jdbc:h2:mem:museotekbox-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Overridden per-test via @DynamicPropertySource to point at the in-test fake IdP.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost/placeholder

uniche.catalogue.base-url=http://localhost:1
museotek.cors.allowed-origins=http://localhost:5173
