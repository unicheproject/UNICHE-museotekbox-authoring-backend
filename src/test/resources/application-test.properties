# Only used by @ActiveProfiles("test") integration tests. The datasource itself is not
# configured here: TestcontainersConfiguration starts a real Postgres container and
# Spring Boot's @ServiceConnection wires spring.datasource.* to it directly, overriding
# anything set in this file. ddl-auto=update is inherited from application.properties.

# application.properties has no default for these; the values are never used, because
# @ServiceConnection replaces the connection details with the container's own.
spring.datasource.username=unused
spring.datasource.password=unused

# Overridden per-test via @DynamicPropertySource to point at the in-test fake IdP.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost/placeholder

uniche.catalogue.base-url=http://localhost:1
museotek.cors.allowed-origins=http://localhost:5173

# Keep integration-test uploads out of the repo's own ./uploads.
museotek.media.upload-dir=target/test-uploads
