server.port=${SERVER_PORT:8080}
server.servlet.context-path=/museotekbox

spring.application.name=museotek-box-backend

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/museotekbox}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# UNICHE platform
spring.security.oauth2.resourceserver.jwt.issuer-uri=${IDP_ISSUER_URI:}
uniche.catalogue.base-url=${CATALOGUE_BASE_URL:}
uniche.tool.slug=${TOOL_SLUG:museotek-box}
museotek.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# OpenAPI — off by default so an env that forgets to set this doesn't silently expose
# the full API schema (or, on swagger-ui, live "try it out") in production.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true

# Actuator
management.endpoints.web.exposure.include=health,info

# Logging — injects the CorrelationIdFilter's per-request id into every log line
logging.pattern.level=%5p [reqId=%X{requestId}]
