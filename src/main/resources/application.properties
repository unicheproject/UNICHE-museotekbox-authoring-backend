server.port=${SERVER_PORT:8080}
server.servlet.context-path=/museotekbox

spring.application.name=museotek-box-backend

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/museotekbox}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate — Liquibase owns the schema, Hibernate only checks its mappings match
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.contexts=${LIQUIBASE_CONTEXTS:}

# UNICHE platform
spring.security.oauth2.resourceserver.jwt.issuer-uri=${IDP_ISSUER_URI:}
uniche.catalogue.base-url=${CATALOGUE_BASE_URL:}
uniche.tool.slug=${TOOL_SLUG:museotekbox}
museotek.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Media library: files on local disk (a Docker volume in deployment). Sizes in bytes.
museotek.media.upload-dir=${MEDIA_UPLOAD_DIR:uploads}
museotek.media.kinds.image.max-bytes=${MEDIA_IMAGE_MAX_BYTES:10485760}
museotek.media.kinds.image.content-types=image/png,image/jpeg,image/webp
museotek.media.kinds.audio.max-bytes=${MEDIA_AUDIO_MAX_BYTES:20971520}
museotek.media.kinds.audio.content-types=audio/mpeg,audio/wav,audio/ogg
museotek.media.kinds.video.max-bytes=${MEDIA_VIDEO_MAX_BYTES:209715200}
museotek.media.kinds.video.content-types=video/mp4
# Spring refuses anything bigger before our per-kind check runs, so this must be at least the
# largest kind's limit (video). The request limit adds 1 MB for the rest of the form.
spring.servlet.multipart.max-file-size=${MEDIA_VIDEO_MAX_BYTES:209715200}
spring.servlet.multipart.max-request-size=${MEDIA_MAX_REQUEST_BYTES:210763776}

# OpenAPI — off by default so an env that forgets to set this doesn't silently expose
# the full API schema (or, on swagger-ui, live "try it out") in production.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true

# Actuator
management.endpoints.web.exposure.include=health,info

# Logging — injects the CorrelationIdFilter's per-request id into every log line
logging.pattern.level=%5p [reqId=%X{requestId}]
