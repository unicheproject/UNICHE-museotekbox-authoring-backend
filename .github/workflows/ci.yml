# Builds and runs every test on each pull request and on pushes to master.
# The tests start Postgres with Testcontainers; GitHub's Ubuntu runners have Docker.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test
        run: bash mvnw --batch-mode test
